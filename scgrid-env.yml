name: scgrid-env
channels:
  - conda-forge
  - bioconda
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.9
  - pip
  - r-base=4.4.0
  - r-seurat
  - r-seuratobject
  - bioconductor-singlecellexperiment
  - bioconductor-zellkonverter
  - r-caret
  - r-ggplot2
  - r-patchwork
  - r-dplyr
  - r-presto
  - pytorch=2.2.2
  - pytorch-cuda=12.1
  - torchvision
  - torchaudio
  - pandas=1.5.3
  - numpy=1.26.4
  - pip:
      - "setuptools<70"
      - -r scgrid-env_requirements.txt
